name: IaC Security Scan (Checkov)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checkov-scan:
    name: Analisis Estatico de Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Checkov sobre Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV_AWS_158,CKV_AWS_18,CKV_AWS_21,CKV_AWS_109,CKV_AWS_111,CKV_AWS_356,CKV_AWS_290,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_150,CKV_AWS_91,CKV_AWS_135,CKV_AWS_126,CKV_AWS_118,CKV_AWS_157,CKV_AWS_161,CKV_AWS_129,CKV_AWS_293,CKV_AWS_226,CKV_AWS_353,CKV_AWS_260,CKV_AWS_382,CKV_AWS_394,CKV2_AWS_30,CKV2_AWS_60,CKV2_AWS_12,CKV2_AWS_11,CKV2_AWS_28
          soft_fail: false
