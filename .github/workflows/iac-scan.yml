name: IaC Security Scan (Checkov)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checkov-scan:
    name: Analisis Estatico de Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Checkov sobre Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV_AWS_158,CKV_AWS_18,CKV_AWS_21,CKV_AWS_109,CKV_AWS_111,CKV_AWS_356,CKV_AWS_290,CKV2_AWS_61,CKV2_AWS_62
          soft_fail: false
