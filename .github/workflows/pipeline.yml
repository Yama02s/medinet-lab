name: MediNet-LAB DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yama02s/medinet-lab/medinet-lab

jobs:
  # ============================================================================
  # ETAPA 1: PRUEBAS UNITARIAS Y DE SEGURIDAD (IDOR, Magic Bytes, Límite 413)
  # ============================================================================
  test:
    name: 1. Automated Security & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short

  # ============================================================================
  # ETAPA 2: ESCANEO SAST (Semgrep) & SCA DE DEPENDENCIAS (pip-audit)
  # ============================================================================
  security-scan:
    name: 2. SAST (Semgrep) & SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit (Dependency Vulnerability Scan)
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit --desc || true

      - name: Run Semgrep SAST (Python & OWASP Top 10 rules)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/fastapi
            p/owasp-top-ten
        env:
          SEMGREP_TIMEOUT: 300

  # ============================================================================
  # ETAPA 3: BUILD DOCKER MULTI-STAGE & ESCANEO DE IMAGEN (Trivy)
  # ============================================================================
  build-and-scan-image:
    name: 3. Build Docker Image & Trivy Scan
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image (Multi-stage non-root)
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Run Trivy Vulnerability Scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ============================================================================
  # ETAPA 4: DESPLIEGUE AUTOMÁTICO EN AWS EC2 VÍA SSH
  # ============================================================================
  deploy-ec2:
    name: 4. Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-scan-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /opt/medinet-lab
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
